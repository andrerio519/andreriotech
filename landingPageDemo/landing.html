<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Penyedia Jasa Aplikasi Digital Berbasis Website"
    />
    <title>Penyedia Jasa Aplikasi Digital Berbasis Website</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="font-sans">
    <!-- Layanan Section -->
    <section id="layanan" class="py-16 bg-gray-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-3xl font-bold text-center mb-12 text-gray-900">
          Example Project
        </h2>
        <div class="grid md:grid-cols-3 gap-8">
          <div
            class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition duration-300"
          >
            <i class="fas fa-balance-scale text-4xl text-blue-900 mb-4"></i>
            <a href="demo2.html" target="_blank">
              <h3 class="text-xl font-semibold mb-3">Demo 2</h3>
              <p class="text-gray-600">Klik Disini Untuk Contoh lainnya</p>
            </a>
          </div>
          <div
            class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition duration-300"
          >
            <i class="fas fa-handshake text-4xl text-blue-900 mb-4"></i>
            <a href="demo3.html" target="_blank">
              <h3 class="text-xl font-semibold mb-3">Demo 3</h3>
              <p class="text-gray-600">Klik Disini Untuk Contoh lainnya</p>
            </a>
          </div>
          <div
            class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition duration-300"
          >
            <i class="fas fa-building text-4xl text-blue-900 mb-4"></i>
            <a href="demo4.html" target="_blank">
              <h3 class="text-xl font-semibold mb-3">Demo 4</h3>
              <p class="text-gray-600">Klik Disini Untuk Contoh lainnya</p>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <p>
          &copy; 2025
          <a href="https://andreriotech.my.id/" target="_blank">andreriotech</a>
        </p>
      </div>
    </footer>

    <script>
      // Mob
      // Smooth scrolling for anchor links
      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", function (e) {
          e.preventDefault();
          document.querySelector(this.getAttribute("href")).scrollIntoView({
            behavior: "smooth",
          });
        });
      });
    </script>
  </body>
</html>
